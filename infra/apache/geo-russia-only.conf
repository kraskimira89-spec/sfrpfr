# Доступ к сайтам только из России (GeoIP DB-IP Country Lite).
# ACME (.well-known/acme-challenge) открыт для Let's Encrypt.
# Поисковые боты и мониторинг sfrfr-* — через GEO_ALLOW (см. geo-allow-bots.conf).

<IfModule maxminddb_module>
    MaxMindDBEnable On
    MaxMindDBFile COUNTRY_CODE /usr/share/GeoIP/dbip-country-lite.mmdb
    MaxMindDBEnv MM_COUNTRY_CODE COUNTRY_CODE/country/iso_code
</IfModule>

IncludeOptional /etc/apache2/geo-allow-ips.conf
IncludeOptional /etc/apache2/geo-allow-bots.conf

<IfModule mod_authz_core.c>
    <LocationMatch "^/\.well-known/acme-challenge/">
        Require all granted
    </LocationMatch>
    <Location />
        <RequireAny>
            Require ip 127.0.0.1 ::1
            Require env GEO_ALLOW
            Require expr "%{REQUEST_URI} =~ m#^/\.well-known/acme-challenge/#"
            Require expr "%{reqenv:MM_COUNTRY_CODE} == 'RU'"
        </RequireAny>
    </Location>
</IfModule>

<IfModule mod_headers.c>
    Header always set X-Geo-Policy "RU-only+bots"
</IfModule>
