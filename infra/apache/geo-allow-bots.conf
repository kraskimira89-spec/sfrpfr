# Allowlist краулеров и CI-проб к геоблоку RU-only (SetEnvIf → GEO_ALLOW).
# Не открывает обычный иноземный трафик — только известные UA.

# Яндекс
SetEnvIfNoCase User-Agent "Yandex(Bot|Images|Video|Media|Webmaster|Favicons|Direct|Metrika|Market|News|Blogs)" GEO_ALLOW=1
# Google
SetEnvIfNoCase User-Agent "Googlebot|Google-InspectionTool|AdsBot-Google|Storebot-Google|APIs-Google|Mediapartners-Google|FeedFetcher-Google|GoogleOther" GEO_ALLOW=1
# Bing / DuckDuckGo / Apple / Mail.ru
SetEnvIfNoCase User-Agent "bingbot|BingPreview|msnbot|adidxbot|DuckDuckBot|Applebot|Mail\.RU_Bot" GEO_ALLOW=1
# Мониторинг SFRFR (url_status / remediate live probes из CI)
SetEnvIfNoCase User-Agent "sfrfr-(status|webmaster|probe)" GEO_ALLOW=1
