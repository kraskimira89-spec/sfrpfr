# Витрина SFRFR HTTPS: proverkastaza.ru
# www → apex (главное зеркало для Яндекс Вебмастера).
# Certbot: не комментировать RewriteRule после renew.

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName proverkastaza.ru
    ServerAlias www.proverkastaza.ru
    DocumentRoot /var/www/taxi-doroga-dobra

    <Directory /var/www/taxi-doroga-dobra>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^www\.proverkastaza\.ru$ [NC]
    RewriteRule ^ https://proverkastaza.ru%{REQUEST_URI} [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/proverkastaza.ru-error.log
    CustomLog ${APACHE_LOG_DIR}/proverkastaza.ru-access.log combined

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/proverkastaza.ru/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/proverkastaza.ru/privkey.pem
</VirtualHost>
</IfModule>
