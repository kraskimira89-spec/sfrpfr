# 301 → https://proverkastaza.ru/
# Домены: proverka-staza.ru, prostaz.ru, taxi-doroga-dobra.ru (старый)
# После a2ensite: certbot --apache -d … для каждого ServerName

<VirtualHost *:80>
    ServerName proverka-staza.ru
    ServerAlias www.proverka-staza.ru
    RewriteEngine On
    RewriteRule ^ https://proverkastaza.ru%{REQUEST_URI} [R=301,L]
    ErrorLog ${APACHE_LOG_DIR}/proverka-staza.ru-error.log
    CustomLog ${APACHE_LOG_DIR}/proverka-staza.ru-access.log combined
</VirtualHost>

<VirtualHost *:80>
    ServerName prostaz.ru
    ServerAlias www.prostaz.ru
    RewriteEngine On
    RewriteRule ^ https://proverkastaza.ru%{REQUEST_URI} [R=301,L]
    ErrorLog ${APACHE_LOG_DIR}/prostaz.ru-error.log
    CustomLog ${APACHE_LOG_DIR}/prostaz.ru-access.log combined
</VirtualHost>

<VirtualHost *:80>
    ServerName taxi-doroga-dobra.ru
    ServerAlias www.taxi-doroga-dobra.ru
    RewriteEngine On
    RewriteRule ^ https://proverkastaza.ru%{REQUEST_URI} [R=301,L]
    ErrorLog ${APACHE_LOG_DIR}/taxi-doroga-dobra.ru-redirect-error.log
    CustomLog ${APACHE_LOG_DIR}/taxi-doroga-dobra.ru-redirect-access.log combined
</VirtualHost>
