# 301 → https://proverkastaza.ru/ (только *:80)
# Только защитные алиасы proverka-staza / prostaz → apex.
# Бывший apex (если ещё в DNS): OLD_ROOT=… в scripts/vps_cutover_proverkastaza.sh.
# После certbot --apache: переустановить этот файл + apache-vhost-redirect-aliases-le-ssl.conf
# (certbot ломает RewriteRule и добавляет конфликтующие *:80 в *-le-ssl).

<VirtualHost *:80>
    ServerName proverka-staza.ru
    ServerAlias www.proverka-staza.ru
    RewriteEngine On
    RewriteRule ^ https://proverkastaza.ru%{REQUEST_URI} [R=301,L]
    ErrorLog ${APACHE_LOG_DIR}/proverka-staza.ru-error.log
    CustomLog ${APACHE_LOG_DIR}/proverka-staza.ru-access.log combined
</VirtualHost>

<VirtualHost *:80>
    ServerName prostaz.ru
    ServerAlias www.prostaz.ru
    RewriteEngine On
    RewriteRule ^ https://proverkastaza.ru%{REQUEST_URI} [R=301,L]
    ErrorLog ${APACHE_LOG_DIR}/prostaz.ru-error.log
    CustomLog ${APACHE_LOG_DIR}/prostaz.ru-access.log combined
</VirtualHost>
