# Витрина SFRFR: proverkastaza.ru
# DocumentRoot: /var/www/taxi-doroga-dobra (тот же WP, без переноса файлов)
# Главное зеркало: https://proverkastaza.ru (без www) — HTTP сразу на HTTPS apex.

<VirtualHost *:80>
    ServerName proverkastaza.ru
    ServerAlias www.proverkastaza.ru
    DocumentRoot /var/www/taxi-doroga-dobra

    <Directory /var/www/taxi-doroga-dobra>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteRule ^ https://proverkastaza.ru%{REQUEST_URI} [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/proverkastaza.ru-error.log
    CustomLog ${APACHE_LOG_DIR}/proverkastaza.ru-access.log combined
</VirtualHost>
