# 301 → https://proverkastaza.ru/ (HTTPS алиасы)
# Certbot --apache часто комментирует кросс-доменный RewriteRule и плодит *:80
# внутри *-le-ssl.conf — после выпуска сертификатов ставить этот файл вручную
# (см. scripts/vps_cutover_proverkastaza.sh).

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName proverka-staza.ru
    ServerAlias www.proverka-staza.ru
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/proverka-staza.ru/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/proverka-staza.ru/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
    RewriteEngine On
    RewriteRule ^ https://proverkastaza.ru%{REQUEST_URI} [R=301,L]
    ErrorLog ${APACHE_LOG_DIR}/proverka-staza.ru-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/proverka-staza.ru-ssl-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName prostaz.ru
    ServerAlias www.prostaz.ru
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/prostaz.ru/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/prostaz.ru/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
    RewriteEngine On
    RewriteRule ^ https://proverkastaza.ru%{REQUEST_URI} [R=301,L]
    ErrorLog ${APACHE_LOG_DIR}/prostaz.ru-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/prostaz.ru-ssl-access.log combined
</VirtualHost>
</IfModule>
