name: sfrfr_analytics
version: "1.0.0"
config-version: 2
profile: sfrfr_analytics

model-paths: ["models"]
target-path: "target"
clean-targets: ["target", "dbt_packages", "logs"]

models:
  sfrfr_analytics:
    staging:
      +materialized: view
    marts:
      +materialized: table
      # RLS/REVOKE применяются после build в scripts/dbt_run.sh:
      # post-hook внутри dbt зависает на Supabase (idle COMMIT / futex).
