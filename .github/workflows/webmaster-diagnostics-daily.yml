name: webmaster-diagnostics-daily

on:
  workflow_dispatch:
  schedule:
    # 06:15 UTC = 09:15 MSK
    - cron: "15 6 * * *"

permissions:
  contents: write

concurrency:
  group: webmaster-diagnostics-daily
  cancel-in-progress: false

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Diagnostics + live fix (API)
        env:
          YANDEX_WEBMASTER_OAUTH_ACCESS_TOKEN: ${{ secrets.YANDEX_WEBMASTER_OAUTH_ACCESS_TOKEN }}
        run: |
          python scripts/yandex_webmaster_diagnostics.py --report --fix

      - name: VPS remediate (robots, favicon, cache)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -euo pipefail
            bash /opt/sfrfr/scripts/vps_webmaster_remediate.sh

      - name: Re-check after VPS fix
        env:
          YANDEX_WEBMASTER_OAUTH_ACCESS_TOKEN: ${{ secrets.YANDEX_WEBMASTER_OAUTH_ACCESS_TOKEN }}
        run: |
          python scripts/yandex_webmaster_diagnostics.py --report --fix || true

      - name: Commit daily report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/marketing-sales/reports/webmaster-diagnostics-*.md
          if git diff --staged --quiet; then
            echo "No report changes"
            exit 0
          fi
          git commit -m "Отчёт Вебмастера $(date -u +%F) [skip deploy]"
          git push origin HEAD
