name: webmaster-diagnostics-daily

on:
  workflow_dispatch:
  schedule:
    # 06:15 UTC = 09:15 MSK
    - cron: "15 6 * * *"

permissions:
  contents: read

concurrency:
  group: webmaster-diagnostics-daily
  cancel-in-progress: false

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Diagnostics + live fix (API)
        env:
          YANDEX_WEBMASTER_OAUTH_ACCESS_TOKEN: ${{ secrets.YANDEX_WEBMASTER_OAUTH_ACCESS_TOKEN }}
        run: |
          python scripts/yandex_webmaster_diagnostics.py --report --fix

      - name: VPS remediate (robots, favicon, cache)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -euo pipefail
            bash /opt/sfrfr/scripts/vps_webmaster_remediate.sh

      - name: Re-check after VPS fix
        env:
          YANDEX_WEBMASTER_OAUTH_ACCESS_TOKEN: ${{ secrets.YANDEX_WEBMASTER_OAUTH_ACCESS_TOKEN }}
        run: |
          python scripts/yandex_webmaster_diagnostics.py --report --fix || true

      # main защищён ruleset'ом: отчёт не коммитится, а публикуется в summary и artifact.
      - name: Report to job summary
        if: always()
        run: |
          report="docs/marketing-sales/reports/webmaster-diagnostics-$(date -u +%F).md"
          echo "REPORT_PATH=$report" >> "$GITHUB_ENV"
          if [ -f "$report" ]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Отчёт $report не создан" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webmaster-diagnostics-${{ github.run_id }}
          path: ${{ env.REPORT_PATH }}
          if-no-files-found: warn
          retention-days: 30
