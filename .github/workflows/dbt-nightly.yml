name: dbt-nightly

on:
  schedule:
    # 05:30 МСК (UTC+3)
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dbt-nightly
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DBT_HOST: ${{ secrets.DBT_HOST }}
      DBT_PORT: ${{ secrets.DBT_PORT }}
      DBT_USER: ${{ secrets.DBT_USER }}
      DBT_PASSWORD: ${{ secrets.DBT_PASSWORD }}
      DBT_DBNAME: ${{ secrets.DBT_DBNAME }}
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install analytics dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[analytics]"

      - name: Configure dbt profile
        run: cp analytics/profiles.yml.example analytics/profiles.yml

      - name: Validate required secrets
        run: |
          for name in DBT_HOST DBT_PORT DBT_USER DBT_PASSWORD DBT_DBNAME; do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub secret: $name" >&2
              exit 1
            fi
          done

      - name: Close stale analytics sessions
        working-directory: analytics
        run: |
          python - <<'PY'
          import os
          import psycopg2

          try:
              with psycopg2.connect(
                  host=os.environ["DBT_HOST"],
                  port=os.environ["DBT_PORT"],
                  user=os.environ["DBT_USER"],
                  password=os.environ["DBT_PASSWORD"],
                  dbname=os.environ["DBT_DBNAME"],
                  sslmode="require",
                  connect_timeout=30,
              ) as connection, connection.cursor() as cursor:
                  cursor.execute(
                      """
                      select pg_terminate_backend(pid)
                      from pg_stat_activity
                      where usename = current_user
                        and pid <> pg_backend_pid()
                        and state in ('idle', 'idle in transaction');
                      """
                  )
                  print(f"Closed {cursor.rowcount} stale analytics session(s).")
          except Exception as error:
              print(f"Could not close stale sessions; continuing: {error}")
          PY

      - name: Validate dbt connection
        working-directory: analytics
        run: dbt debug --profiles-dir .

      - name: Build marts
        working-directory: analytics
        run: dbt build --profiles-dir . --threads 1 --no-populate-cache

      - name: Upload dbt artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-artifacts-${{ github.run_id }}
          path: |
            analytics/target/
            analytics/logs/
          if-no-files-found: warn
          retention-days: 14
